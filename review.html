<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Review Answers | NMT CBT</title>
<link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css?v=5" />
<link rel="stylesheet" href="css/review.css?v=3" />
<link rel="stylesheet" href="css/responsive.css?v=3" />
</head>
<body>
  <div class="page-loader" id="pageLoader" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner container">
      <div class="brand">
        <img src="assets/icons/logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">Nihongo Mock Test</span>
      </div>
      <div class="review-topbar-actions">
        <button id="darkModeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button class="btn btn-secondary" id="backToResultBtn">Back to Result</button>
      </div>
    </div>
  </header>

  <main class="container review-main">
    <div class="review-toolbar card">
      <div class="review-filter-group" role="group" aria-label="Filter questions">
        <button type="button" class="filter-chip active" data-filter="all">All</button>
        <button type="button" class="filter-chip" data-filter="correct">Correct</button>
        <button type="button" class="filter-chip" data-filter="wrong">Wrong</button>
        <button type="button" class="filter-chip" data-filter="skipped">Skipped</button>
        <button type="button" class="filter-chip" data-filter="bookmarked">Bookmarked</button>
      </div>
      <input type="search" id="reviewSearchInput" class="text-input text-input-sm" placeholder="Search question #" aria-label="Search question number" />
    </div>

    <div class="review-list" id="reviewList"></div>
  </main>

  <script type="module" src="js/review.js?v=7"></script>
</body>
</html>
