<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<title>Review Answers | NMT CBT</title>
<link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css?v=9" />
<link rel="stylesheet" href="css/exam.css?v=17" />
<link rel="stylesheet" href="css/review.css?v=7" />
<link rel="stylesheet" href="css/responsive.css?v=6" />
</head>
<body class="review-body">
  <div class="page-loader" id="pageLoader" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <!-- PRINT REDACTION fallback: same pattern as css/exam.css's .print-redacted-message — Ctrl+P is intercepted as a keyboard shortcut (js/security.js), this covers the browser's own File > Print menu, which JS can't block. -->
  <div class="print-redacted-message">This page's content cannot be printed.</div>

  <!-- WATERMARK: same shared implementation as exam.html/result.html — the .exam-watermark class and its keyframes live in css/style.css (already loaded on this page), a static CSS background pattern with no per-page JS/data dependency at all. pointer-events:none is explicit and load-bearing in that shared rule — must never be able to intercept a click, no exceptions. -->
  <div class="exam-watermark no-print" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-inner container">
      <div class="brand">
        <img src="assets/icons/logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">Nihongo Mock Test</span>
      </div>
      <div class="review-topbar-actions">
        <button id="darkModeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
        <button class="btn btn-secondary" id="backToResultBtn">Back to Result</button>
      </div>
    </div>
  </header>

  <!-- ZOOM CONTROLS — same application-level zoom system as exam.html (reuses
       the shared .exam-zoom-controls/.zoom-btn CSS from css/exam.css and the
       same --exam-zoom custom property). Only shown/active while in Fullscreen
       API fullscreen — see js/review.js's updateZoomModeForFullscreen(). -->
  <div class="exam-zoom-controls no-print" id="reviewZoomControls" hidden>
    <button type="button" class="zoom-btn" id="reviewZoomOutBtn" aria-label="Zoom out">−</button>
    <span class="zoom-level" id="reviewZoomLevelText" aria-live="polite">100%</span>
    <button type="button" class="zoom-btn" id="reviewZoomInBtn" aria-label="Zoom in">+</button>
  </div>

  <main class="container review-main security-protected-content">
    <div class="review-list" id="reviewList"></div>
  </main>

  <!-- FULLSCREEN REQUIREMENT — same reused pattern as exam.html's examFullscreenModal (own ids/copy, same .exam-security-modal styling from css/exam.css so nothing is duplicated). Shown before the review content is usable, and again if fullscreen is exited while reviewing. -->
  <dialog id="reviewFullscreenModal" class="modal exam-security-modal" aria-labelledby="reviewFullscreenTitle" aria-describedby="reviewFullscreenText" aria-modal="true">
    <div class="modal-body exam-security-modal-body">
      <div class="exam-security-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <h2 id="reviewFullscreenTitle">Review Mode</h2>
      <p id="reviewFullscreenText">Fullscreen is required to view your answer review.</p>
      <p class="exam-security-modal-error" id="reviewFullscreenError" hidden>Please allow fullscreen mode to continue.</p>
      <div class="modal-actions exam-security-modal-actions">
        <button type="button" class="btn btn-primary exam-security-modal-btn" id="reviewFullscreenBtn">Enter Fullscreen</button>
      </div>
    </div>
  </dialog>

  <script type="module" src="js/review.js?v=15"></script>
</body>
</html>
