<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | NMT CBT</title>
<meta name="description" content="Japanese JFT-Basic Computer Based Test practice platform." />
<link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css?v=6" />
<link rel="stylesheet" href="css/responsive.css?v=3" />
</head>
<body>
  <div class="page-loader" id="pageLoader" aria-hidden="true">
    <div class="spinner"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner container">
      <div class="brand">
        <img src="assets/icons/logo.svg" alt="" class="brand-logo" />
        <span class="brand-name">Nihongo Mock Test</span>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span id="userDisplayName" style="font-size:0.85rem; color: var(--color-text-muted);"></span>
        <button id="signOutBtn" class="btn btn-ghost" type="button">Sign out</button>
        <button id="darkModeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container home-main" style="max-width: 960px;">
    <h1 class="home-title" id="welcomeHeading" style="margin-bottom: 4px;">Welcome</h1>
    <p style="color: var(--color-text-muted); margin: 0 0 24px;">Your JFT Mock Tests</p>

    <div id="testsList" class="dashboard-test-grid" aria-live="polite">
      <p id="testsEmptyState" hidden style="color: var(--color-text-muted);">No mock tests are available for your account yet. Contact your administrator.</p>
    </div>

    <section style="margin-top:40px;">
      <h2 class="home-title" style="font-size:1.2rem; margin-bottom:12px;">My Results</h2>
      <div id="resultsList" aria-live="polite">
        <p id="resultsEmptyState" hidden style="color: var(--color-text-muted);">No completed attempts yet.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Nihongo Mock Test. Practice platform for JFT-Basic, SSW, JLPT &amp; Nursing Care exams.</p>
  </footer>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
